    design_overview: "This 30-minute hands-on lab is designed for intermediate tech\
      \ sales staff who need to demonstrate the Keycloak operator installation workflow\
      \ to customers. Participants use the OpenShift web console to locate, install,\
      \ and verify the Red Hat build of Keycloak operator from OperatorHub on OCP\
      \ 4.21. The lab fills a gap in the catalog \u2014 no existing content teaches\
      \ this as a standalone, sales-oriented exercise."
    module_summaries:
